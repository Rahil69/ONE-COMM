<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1a20; font-family: system-ui, sans-serif; }
  #hero-scene { position: fixed; inset: 0; }
  #hero-scene canvas { display: block; width: 100%; height: 100%; }
  .help { position: fixed; left: 16px; bottom: 16px; color: #cbd5e1; font-size: 13px; background: rgba(0,0,0,.4); padding: 8px 12px; border-radius: 10px; }
</style>
</head>
<body>
<div id="hero-scene"></div>
<p class="help">Studio — open <b>?record</b> to render all hero videos (or <b>?record=hero-mobile-dark</b> for one). Needs serve.js running.</p>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
/* Renders the looping hero videos from the same scene the site runs live (hero-scene.js).
   Frames are rendered one at a time at exact times (perfectly smooth regardless of this
   computer's speed), encoded to H.264 in the browser, muxed to MP4 and saved next to the
   page by serve.js. The first second blends into the last, so the loop has no jump. */
import { mountHeroScene } from './hero-scene.js';
const scene = mountHeroScene(document.getElementById('hero-scene'));
const params = new URLSearchParams(location.search);
if (params.has('record')) runRecorder(params.get('record'));
async function runRecorder(only) {
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs');
  const LOOP = 18, FADE = 1.2, FPS = 30;
  // one video per screen shape × theme (the page picks the closest shape)
  const SHAPES = [
    { shape: 'desktop',        w: 1920, h: 1080, bitrate: 2.6e6 }, // 16:9 laptops / monitors
    { shape: 'tablet',         w: 1600, h: 1200, bitrate: 2.2e6 }, // 4:3 tablets in landscape
    { shape: 'tablet-portrait', w: 1200, h: 1600, bitrate: 2.2e6 }, // 3:4 tablets upright
    { shape: 'mobile',         w: 864,  h: 1464, bitrate: 1.9e6 }, // ~9:15 — a phone in Safari with its bars showing (the hero's real shape)
    { shape: 'mobile-tall',    w: 864,  h: 1872, bitrate: 2e6 },   // ~9:19.5 — full-screen / home-screen apps
  ];
  const VARIANTS = SHAPES.flatMap(sh => ['dark', 'light'].map(theme => ({ name: 'hero-' + sh.shape + '-' + theme, w: sh.w, h: sh.h, theme, bitrate: sh.bitrate }))).filter(v => !only || v.name === only);
  const status = Object.assign(document.createElement('div'), { id: 'rec-status' });
  status.style.cssText = 'position:fixed;left:16px;top:80px;z-index:99;padding:10px 14px;border-radius:12px;background:#111827;color:#fff;font:600 14px system-ui';
  document.body.append(status);
  const save = async (name, body) => { const r = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body }); if (!r.ok) throw new Error('save failed: ' + name); };
  const comp = document.createElement('canvas'), cx = comp.getContext('2d');
  window.__rec = { done: false, files: [] };
  for (const v of VARIANTS) {
    comp.width = v.w; comp.height = v.h;
    scene.beginCapture(v.w, v.h, v.theme);
    const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: v.w, height: v.h, frameRate: FPS }, fastStart: 'in-memory' });
    let encErr = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; } });
    enc.configure({ codec: 'avc1.640028', width: v.w, height: v.h, bitrate: v.bitrate, bitrateMode: 'constant', framerate: FPS }); // constant: keeps file sizes predictable
    const N = Math.round(LOOP * FPS);
    for (let i = 0; i < N; i++) {
      const t = i / FPS;
      cx.globalAlpha = 1;
      if (t < FADE) { cx.drawImage(scene.renderAt(t + LOOP), 0, 0); cx.globalAlpha = t / FADE; } // seamless loop
      cx.drawImage(scene.renderAt(t), 0, 0);
      if (i === 0) await save('videos/' + v.name + '.jpg', await new Promise(r => comp.toBlob(r, 'image/jpeg', .86)));
      const vf = new VideoFrame(comp, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
      if (encErr) throw encErr;
      if (enc.encodeQueueSize > 6) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
      if (i % 15 === 0) { status.textContent = `Recording ${v.name}: ${Math.round(i / N * 100)}%`; await new Promise(r => setTimeout(r)); }
    }
    await enc.flush(); muxer.finalize();
    await save('videos/' + v.name + '.mp4', muxer.target.buffer);
    window.__rec.files.push(v.name);
  }
  scene.endCapture();
  status.textContent = 'Done: ' + window.__rec.files.join(', ');
  window.__rec.done = true;
}
</script>
</body>
</html>
